name: SPEK Legal Pages Checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/legal-pages-review-20261019]
jobs:
  php-checks:
    name: PHP syntax and targeted logic
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: PHP environment
        run: |
          php -v
      - name: Lint PHP source code
        run: |
          set -eu
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > /tmp/spek-php-lint.log
          tail -n 12 /tmp/spek-php-lint.log
          echo "PHP files checked: $(wc -l < /tmp/spek-php-lint.log)"
      - name: Run existing importer tests
        run: |
          set -eu
          php tests/test-product-sku-five-digits.php
          php tests/test-product-taxonomy-corrections.php
      - name: Validate legal and newsletter source contract
        run: php tests/test-legal-newsletter.php
